# Builds the package on FreeBSD. A tag "v<version>" also publishes it as a GitHub release.
name: Package

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag must match the version in the Makefile
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(awk '$1 == "PLUGIN_VERSION=" { print $2 }' os-inversa-panel/Makefile)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME}, but the Makefile says ${version}" >&2
            exit 1
          fi

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          usesh: true
          envs: 'GITHUB_SHA'
          run: |
            tools/build-pkg.sh "$(echo "${GITHUB_SHA}" | cut -c1-9)"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/*.pkg
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the same file under a name that does not change, for the install command in the README
          cp "dist/os-inversa-panel-${version}.pkg" dist/os-inversa-panel.pkg
          awk -v v="## ${version}" '$0 ~ "^## " { on = (index($0, v) == 1) ; next } on' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            "dist/os-inversa-panel-${version}.pkg" dist/os-inversa-panel.pkg \
            --title "Inversa Panel ${version}" --notes-file notes.md --verify-tag
