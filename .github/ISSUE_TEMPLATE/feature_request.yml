name: Feature request
description: Something the panel should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to get done
      description: The situation you are in, not only the feature. English or Turkish.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How should it work
      description: What you would click and what should happen on the firewall.
  - type: textarea
    id: today
    attributes:
      label: How do you do it today
      description: On OPNsense's own pages, with another tool, or not at all.
