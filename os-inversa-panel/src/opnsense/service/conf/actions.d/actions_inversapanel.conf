[hosts]
command:/usr/local/opnsense/scripts/OPNsense/InversaPanel/hosts.py
parameters:%s
type:script_output
message:Inversa Panel: list network hosts
cache_ttl:5

[dnsbl]
command:/usr/local/opnsense/scripts/OPNsense/InversaPanel/dnsbl.sh
parameters:
type:script
message:Inversa Panel: refresh blocklists and flush DNS cache

[killstates]
command:/usr/local/opnsense/scripts/OPNsense/InversaPanel/killstates.py
parameters:%s
type:script
message:Inversa Panel: kill states of blocked devices

[schedule]
command:/usr/local/opnsense/scripts/OPNsense/InversaPanel/schedule.php
parameters:
type:script
message:Inversa Panel: evaluate schedules

[rollback]
command:/usr/local/opnsense/scripts/OPNsense/InversaPanel/rollback.php
parameters:%s %s
type:script
message:Inversa Panel: put an unconfirmed change back

[nettest]
command:/usr/local/opnsense/scripts/OPNsense/InversaPanel/nettest.py
parameters:
type:script_output
message:Inversa Panel: connectivity test

[geoip]
command:/usr/local/opnsense/scripts/OPNsense/InversaPanel/geoip_dbip.py
parameters:%s
type:script
message:Inversa Panel: free country database (DB-IP Lite)

[geoupdate]
command:/usr/local/opnsense/scripts/filter/download_geoip.py > /dev/null && /usr/local/sbin/configctl filter reload
parameters:
type:script
message:Inversa Panel: fetch the country database set in OPNsense, then load the country rules

[ips]
command:/usr/local/opnsense/scripts/OPNsense/InversaPanel/ips.sh
parameters:
type:script
message:Inversa Panel: attack protection (fetch rules, start or stop Suricata)
