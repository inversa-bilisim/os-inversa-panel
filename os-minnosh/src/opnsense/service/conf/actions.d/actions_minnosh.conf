[hosts]
command:/usr/local/opnsense/scripts/OPNsense/Minnosh/hosts.py
parameters:%s
type:script_output
message:Minnosh: list network hosts
cache_ttl:5

[dnsbl]
command:/usr/local/opnsense/scripts/OPNsense/Minnosh/dnsbl.sh
parameters:
type:script
message:Minnosh: refresh blocklists and flush DNS cache

[killstates]
command:/usr/local/opnsense/scripts/OPNsense/Minnosh/killstates.py
parameters:%s
type:script
message:Minnosh: kill states of blocked devices

[schedule]
command:/usr/local/opnsense/scripts/OPNsense/Minnosh/schedule.php
parameters:
type:script
message:Minnosh: evaluate schedules

[rollback]
command:/usr/local/opnsense/scripts/OPNsense/Minnosh/rollback.php
parameters:%s %s
type:script
message:Minnosh: network change safety net

[nettest]
command:/usr/local/opnsense/scripts/OPNsense/Minnosh/nettest.py
parameters:
type:script_output
message:Minnosh: connectivity test

[geoip]
command:/usr/local/opnsense/scripts/OPNsense/Minnosh/geoip_dbip.py %s && /usr/local/sbin/configctl filter refresh_aliases
parameters:%s
type:script
message:Minnosh: free country database (DB-IP Lite)
